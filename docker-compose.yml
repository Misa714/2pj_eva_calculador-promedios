version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - NODE_ENV=production
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
