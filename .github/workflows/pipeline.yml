name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Instalar Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Instalar dependencias
      run: npm ci

    - name: Ejecutar ESLint
      run: npx eslint . || true

    - name: Ejecutar pruebas
      run: npm test

    - name: Construir imagen Docker
      run: docker build -t calculador-promedios .

    - name: Guardar imagen comprimida
      run: docker save calculador-promedios | gzip > imagen.tar.gz

    - name: Subir artefacto
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: imagen.tar.gz

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Descargar artefacto
      uses: actions/download-artifact@v4
      with:
        name: docker-image

    - name: Instalar Docker Compose en EC2
      env:
        EC2_HOST: 54.205.239.254
        EC2_USER: ubuntu
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/llave-devops.pem
        chmod 600 ~/.ssh/llave-devops.pem
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/llave-devops.pem $EC2_USER@$EC2_HOST 'sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose && sudo chmod +x /usr/local/bin/docker-compose && docker-compose --version'

    - name: Limpiar contenedores viejos y desplegar
      env:
        EC2_HOST: 54.205.239.254
        EC2_USER: ubuntu
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/llave-devops.pem
        chmod 600 ~/.ssh/llave-devops.pem
        
        # Cargar la nueva imagen
        gunzip -c imagen.tar.gz | ssh -o StrictHostKeyChecking=no -i ~/.ssh/llave-devops.pem $EC2_USER@$EC2_HOST "docker load"
        
        # Copiar docker-compose.yml
        scp -o StrictHostKeyChecking=no -i ~/.ssh/llave-devops.pem docker-compose.yml $EC2_USER@$EC2_HOST:/home/ubuntu/
        
        # Limpiar TODO: contenedores viejos (docker run) y docker-compose anterior
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/llave-devops.pem $EC2_USER@$EC2_HOST "
          echo '=== Limpiando contenedores viejos ==='
          docker stop app 2>/dev/null || true
          docker rm app 2>/dev/null || true
          docker stop \$(docker ps -aq) 2>/dev/null || true
          docker rm \$(docker ps -aq) 2>/dev/null || true
          
          echo '=== Deteniendo docker-compose anterior ==='
          cd /home/ubuntu && docker-compose down --remove-orphans 2>/dev/null || true
          
          echo '=== Iniciando nuevo despliegue ==='
          docker-compose up -d
        "

    - name: Verificar despliegue
      if: always()
      env:
        EC2_HOST: 54.205.239.254
        EC2_USER: ubuntu
        SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/llave-devops.pem
        chmod 600 ~/.ssh/llave-devops.pem
        sleep 8
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/llave-devops.pem $EC2_USER@$EC2_HOST '
          echo "=== CONTENEDORES ACTIVOS ==="
          docker ps
          echo ""
          echo "=== HEALTH CHECK ==="
          curl -s http://localhost/health || echo "Health check falló"
          echo ""
          echo "=== DB CHECK ==="
          curl -s http://localhost/db || echo "DB check falló"
        '